<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest Opções — Scanner</title>
<style>
:root{--bg:#0e0e10;--card:#17171a;--gold:#d4af37;--txt:#eee;--mut:#999;--red:#e5484d;--grn:#3fb950}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding:16px;max-width:620px;margin:auto}
h1{font-size:22px;color:var(--gold);margin:4px 0 2px}p.s{color:var(--mut);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid #2a2a2f;border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#101012;color:var(--txt);font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#111;font-weight:700;font-size:16px}
button:disabled{opacity:.5}.big{font-size:28px;font-weight:700}.k{color:var(--mut);font-size:12px}.ver{padding:12px;border-radius:10px;font-size:14px;line-height:1.4;margin-bottom:12px}
.bad{background:#2a1214;border:1px solid var(--red)}.ok{background:#12241a;border:1px solid var(--grn)}.warn{background:#2a2312;border:1px solid var(--gold)}
.asset{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #303036}.asset:last-child{border:0}.muted{color:var(--mut)}.tag{font-size:11px;border-radius:6px;padding:3px 7px;background:#29292e}
</style></head><body>
<h1>Backtest Opções — Scanner</h1>
<p class="s">Procura automaticamente o melhor resultado entre BTC, ETH, BNB, SOL e XRP usando candles da Binance. Somente análise: não opera nem envia ordens.</p>
<div class="card">
<div class="row"><div><label>Timeframe</label><select id="interval"><option value="1m">M1</option><option value="5m">M5</option></select></div>
<div><label>Expiração (velas)</label><input id="expiry" type="number" value="1" min="1" max="10"></div></div>
<div class="row"><div><label>Payout (%)</label><input id="payout" type="number" value="85"></div>
<div><label>ADX mínimo</label><input id="adxMin" type="number" value="20"></div></div>
<div class="row"><div><label>Candles por ativo</label><input id="candles" type="number" value="1000" min="500" max="10000"></div>
<div><label>RSI compra (≤)</label><input id="rsiLow" type="number" value="40"></div></div>
<label>RSI venda (≥)</label><input id="rsiHigh" type="number" value="60">
<button id="go">Procurar melhor ativo</button></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id), pct=x=>(x*100).toFixed(1)+'%';
$('go').onclick=async()=>{const b=$('go');b.disabled=true;b.textContent='Analisando BTC, ETH, BNB, SOL e XRP...';$('out').innerHTML='<div class="ver warn">Baixando candles e avaliando os cinco ativos. Aguarde.</div>';
const q=new URLSearchParams();['interval','expiry','payout','adxMin','candles','rsiLow','rsiHigh'].forEach(k=>q.set(k,$(k).value));
try{const resp=await fetch('/api/scan?'+q),r=await resp.json();if(!resp.ok&&r.erro)throw new Error(r.erro);
let html='';if(r.best){const best=r.results.find(x=>x.symbol===r.best),t=best.teste;
html+='<div class="card"><div class="k">MELHOR RESULTADO RELATIVO</div><div class="big">'+r.best+'</div><div class="k">Acerto no teste independente: '+pct(t.taxaAcerto)+' · '+t.entradas+' entradas</div><div class="k">Equilíbrio necessário: '+pct(t.pontoDeEquilibrio)+' · Resultado: '+t.resultadoUnidades.toFixed(1)+' unidades</div></div>';
html+='<div class="ver '+(r.hasEvidence?'ok':'warn')+'">'+r.message+'</div>';}else html+='<div class="ver bad">'+r.message+'</div>';
html+='<div class="card"><b>Comparação dos ativos</b>';
for(const x of r.results){if(x.erro){html+='<div class="asset"><b>'+x.symbol+'</b><span class="muted">'+x.erro+'</span></div>';continue;}
const t=x.teste, proof=t.entradas>=100&&t.intervalo95[0]>t.pontoDeEquilibrio;
html+='<div class="asset"><div><b>'+x.symbol+'</b><div class="k">'+t.entradas+' entradas · '+t.vitorias+' vitórias / '+t.derrotas+' derrotas</div></div><div style="text-align:right"><b>'+pct(t.taxaAcerto)+'</b><div class="tag">'+(proof?'indício estatístico':'não comprovado')+'</div></div></div>';}
html+='</div><div class="card"><div class="k">Os 30% mais recentes são o teste independente. O ranking não garante lucro futuro.</div></div>';$('out').innerHTML=html;
}catch(e){$('out').innerHTML='<div class="ver bad">Erro: '+e.message+'</div>';}
b.disabled=false;b.textContent='Procurar melhor ativo';};
</script></body></html>
